name: Release

# Builds the InvoiceMuse release package with resources/release/build-package.sh.
#
#   - Push a version tag to build the package and attach it to a draft GitHub release:
#         git tag v1.0.0
#         git push origin v1.0.0
#     Tags with a suffix (v1.1.0-rc.1) become pre-releases. Review the draft, then publish it.
#   - Run it manually (workflow_dispatch) to build the package as a workflow artifact
#     without creating a release.
#
# The version must match INVOICEMUSE_VERSION in application/config/constants.php and the
# version in package.json; build-package.sh stops the build when they differ.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

permissions:
  contents: write   # create the draft release and upload its assets

jobs:
  release:
    name: Build and package release
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(sed -n "s/.*define('INVOICEMUSE_VERSION', '\([^']*\)').*/\1/p" application/config/constants.php)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "package=invoicemuse-v$VERSION.zip" >> "$GITHUB_OUTPUT"

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd, bcmath, dom, intl, xml, zip, mbstring, curl
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'yarn'

      - name: Build package
        run: resources/release/build-package.sh "${{ steps.version.outputs.version }}" "$RUNNER_TEMP/dist"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: invoicemuse-v${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/dist/

      - name: Extract release notes
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          awk -v heading="## [${{ steps.version.outputs.version }}]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' .github/CHANGELOG.md > "$RUNNER_TEMP/RELEASE_NOTES.md"
          if [ ! -s "$RUNNER_TEMP/RELEASE_NOTES.md" ]; then
            echo "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/.github/CHANGELOG.md)." > "$RUNNER_TEMP/RELEASE_NOTES.md"
          fi

      - name: Create draft GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: InvoiceMuse ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/RELEASE_NOTES.md
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            ${{ runner.temp }}/dist/${{ steps.version.outputs.package }}
            ${{ runner.temp }}/dist/${{ steps.version.outputs.package }}.sha256

      - name: Summary
        run: |
          {
            echo "## Release build complete"
            echo ""
            echo "**Version:** \`${{ steps.version.outputs.version }}\`"
            echo "**Package:** \`${{ steps.version.outputs.package }}\`"
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo ""
              echo "A **draft** release was created. Review it and publish it when ready."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
